{% extends "base.html" %}

{% block title %}
    Вход
{% endblock %}

{% block content %}

<div class="container">
    <div class="auth-card">
        <h1>Вход</h1>
        <p>
            Войдите для доступа к административной панели.
        </p>

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-field">
                <label for="username">
                    Логин
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-field">
                <label for="password">
                    Пароль
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button
                type="submit"
                class="button"
            >
                Войти
            </button>
        </form>
    </div>
</div>

{% endblock %}
